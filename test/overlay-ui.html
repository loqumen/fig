<!doctype html>
<!-- Headless UI test for the fig overlay: comment pins, replies, highlight
     detail click (the flash bug), and refresh persistence. Run via
     test/overlay-ui.sh — it dumps the DOM after a virtual-time budget and
     greps the PASS/FAIL lines written into #results. -->
<html>
<head><meta charset="utf-8"><title>fig overlay test</title></head>
<body>
<h1 id="h">Alpha beta gamma delta epsilon zeta</h1>
<p id="p1">The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs.</p>
<pre id="results">RUNNING</pre>
<script>
  // Minimal chrome shim: enough of runtime + storage.local for the overlay.
  // storage deep-copies on set so it behaves like the real serializing API.
  window.__figTestMem = {};
  window.chrome = {
    runtime: {
      sendMessage: (msg, cb) => {
        if (!cb) return;
        if (msg && msg.type === "fig-jobs") {
          cb({ ok: true, data: [
            { slug: "alpha-0801", title: "Alpha Landing Page", phase: "done", startedAt: "2026-08-01T14:00:00Z", markings: 3, rounds: 2, pdf: false, url: "/pages/alpha-0801/" },
            { slug: "beta-0802", title: "Beta Brochure", phase: "error", startedAt: "2026-08-02T15:00:00Z", markings: 1, rounds: 1, pdf: false, url: "/jobs/beta-0802/" },
          ]});
          return;
        }
        if (msg && msg.type === "fig-settings-get") {
          // Linked site AND legacy project available: exercises the review-site
          // dropdown, the publish action, and the collapsed link flow.
          cb({ ok: true, data: { target: "linked", model: "", effort: "", legacyVercel: true,
            publish: { status: "linked", provider: "vercel", url: "https://fig-review-test.vercel.app" } } });
          return;
        }
        if (msg && msg.type === "fig-publish") {
          window.__figPublishCalls = (window.__figPublishCalls || []).concat([msg.slug ?? null]);
          cb({ ok: true, data: { publishing: "alpha-0801", title: "Alpha Landing Page" } });
          return;
        }
        if (msg && msg.type === "fig-deploy-status") {
          cb({ ok: true, data: { deploy: "Published: https://fig-review-test.vercel.app/alpha-0801/" } });
          return;
        }
        cb({ ok: true });
      },
      getURL: (p) => p,
      getManifest: () => ({ version: "test" }),
    },
    storage: {
      local: {
        set: (obj, cb) => { Object.assign(window.__figTestMem, JSON.parse(JSON.stringify(obj))); if (cb) cb(); },
        get: (k, cb) => cb({ [k]: window.__figTestMem[k] }),
        remove: (k, cb) => { delete window.__figTestMem[k]; if (cb) cb(); },
      },
    },
  };
</script>
<script src="../extension/fig-overlay.js"></script>
<script>
(async () => {
  const out = [];
  const ok = (name, cond) => out.push((cond ? "PASS" : "FAIL") + " :: " + name);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const fire = (el, type, opts) =>
    el.dispatchEvent(new MouseEvent(type, Object.assign({ bubbles: true, cancelable: true, view: window }, opts)));
  const key = (el, k) =>
    el.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));

  try {
    const bar = document.querySelector(".fig-toolbar");
    ok("toolbar built", !!bar);
    const btns = [...bar.querySelectorAll(".fig-btn")]; // draw, comment, highlight, clear, help, gear
    const commentBtn = btns[1], highlightBtn = btns[2];
    const clearBtn = bar.querySelector(".fig-clear");
    const p = document.getElementById("p1");

    // --- comment pin + reply -------------------------------------------
    commentBtn.click();
    fire(p, "click", { clientX: 40, clientY: Math.round(p.getBoundingClientRect().top + 5) });
    const note = document.querySelector(".fig-note textarea");
    ok("comment note editor opens", !!note);
    note.value = "make this better";
    key(note, "Enter");
    const pin = document.querySelector(".fig-pin");
    ok("pin created and numbered", !!pin && pin.textContent === "1");
    pin.click();
    let detail = document.querySelector(".fig-detail");
    ok("pin click opens detail", !!detail);
    let rbox = detail.querySelector(".fig-detail-replybox");
    rbox.value = "reply one";
    key(rbox, "Enter");
    detail = document.querySelector(".fig-detail");
    const rep = detail && detail.querySelector(".fig-detail-reply-text");
    ok("reply posts and appears", !!rep && rep.textContent === "reply one");
    key(document.body, "Escape");
    ok("Escape closes detail", !document.querySelector(".fig-detail"));

    // --- highlight + note ------------------------------------------------
    highlightBtn.click();
    const tn = p.firstChild;
    const sel = window.getSelection();
    const r = document.createRange();
    r.setStart(tn, 4); r.setEnd(tn, 19); // "quick brown fox"
    sel.removeAllRanges(); sel.addRange(r);
    fire(p, "mousedown", { clientX: 10, clientY: 10 });
    fire(p, "mouseup", { clientX: 60, clientY: 10 });
    const note2 = document.querySelector(".fig-note textarea");
    ok("highlight note editor opens", !!note2);
    note2.value = "flag this";
    key(note2, "Enter");
    const mark = document.querySelector("mark[data-fig-highlight]");
    ok("mark painted over selection", !!mark && /quick brown fox/.test(mark.textContent));

    // --- THE FLASH BUG: click a mark while highlight mode is active ------
    fire(mark, "mousedown", {});
    ok("mark mousedown opens detail (highlight mode)", !!document.querySelector(".fig-detail"));
    fire(mark, "mouseup", {});
    fire(mark, "click", {});
    detail = document.querySelector(".fig-detail");
    ok("detail SURVIVES the click (flash bug fixed)", !!detail);
    rbox = detail && detail.querySelector(".fig-detail-replybox");
    if (rbox) { rbox.value = "hl reply"; key(rbox, "Enter"); }
    ok("reply on highlight detail appears",
      [...document.querySelectorAll(".fig-detail-reply-text")].some((n) => n.textContent === "hl reply"));
    key(document.body, "Escape");

    // --- persistence: toggle off/on restores everything ------------------
    await sleep(400); // let the debounced persist land
    window.__figToggle(); // off
    ok("teardown removes pins", !document.querySelector(".fig-pin"));
    ok("teardown removes marks", !document.querySelector("mark[data-fig-highlight]"));
    window.__figToggle(); // on -> restore
    await sleep(200);
    const pin2 = document.querySelector(".fig-pin");
    ok("pin restored after toggle", !!pin2 && pin2.textContent === "1");
    const mark2 = document.querySelector("mark[data-fig-highlight]");
    ok("mark restored via quote re-anchor", !!mark2 && /quick brown fox/.test(mark2.textContent));
    if (mark2) fire(mark2, "click", {});
    detail = document.querySelector(".fig-detail");
    ok("restored highlight opens detail", !!detail);
    ok("restored reply intact", !!detail &&
      [...detail.querySelectorAll(".fig-detail-reply-text")].some((n) => n.textContent === "hl reply"));
    key(document.body, "Escape");

    // --- localStorage fallback: chrome.storage lost, page storage survives
    window.__figToggle(); // off (flushes)
    for (const k2 of Object.keys(window.__figTestMem)) delete window.__figTestMem[k2];
    window.__figToggle(); // on
    await sleep(200);
    ok("restore works from localStorage alone", !!document.querySelector(".fig-pin"));

    // --- pin dragging: move updates the comment, click still opens -------
    const pinD = document.querySelector(".fig-pin");
    const p0 = { x: parseFloat(pinD.style.left), y: parseFloat(pinD.style.top) };
    const pfire = (el2, type, opts) =>
      el2.dispatchEvent(new PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, button: 0, pointerId: 1 }, opts)));
    pfire(pinD, "pointerdown", { clientX: 50, clientY: 50 });
    pfire(pinD, "pointermove", { clientX: 90, clientY: 75 });
    pfire(pinD, "pointerup", {});
    fire(pinD, "click", {});
    const p1 = { x: parseFloat(pinD.style.left), y: parseFloat(pinD.style.top) };
    ok("pin drag moves it (+40,+25)", Math.round(p1.x - p0.x) === 40 && Math.round(p1.y - p0.y) === 25);
    ok("drag's tail click does not open the detail", !document.querySelector(".fig-detail"));
    pinD.click();
    ok("plain click after a drag still opens the detail", !!document.querySelector(".fig-detail"));
    key(document.body, "Escape");
    await sleep(400); // drag persists (debounced)
    window.__figToggle(); window.__figToggle(); // refresh-equivalent
    await sleep(200);
    const pinR = document.querySelector(".fig-pin");
    ok("dragged position survives restore", !!pinR && Math.round(parseFloat(pinR.style.left) - p0.x) === 40);

    // --- "All figs" popover ----------------------------------------------
    const bar2 = document.querySelector(".fig-toolbar");
    const btns2 = [...bar2.querySelectorAll(".fig-btn")]; // draw, comment, highlight, clear, help, figs, gear
    const helpBtn = btns2[4], figsBtn = btns2[5];
    figsBtn.click();
    await sleep(100);
    const figsPop = document.querySelector(".fig-figs-pop");
    ok("figs button opens the All figs popover", !!figsPop);
    const titles = [...document.querySelectorAll(".fig-figs-title")].map((n) => n.textContent);
    ok("figs rows show human titles, not slugs", titles.includes("Alpha Landing Page") && titles.includes("Beta Brochure"));
    ok("figs meta shows markings + rounds", /3 markings/.test(figsPop.textContent) && /round 2/.test(figsPop.textContent));
    ok("failed fig labeled with retry hint", /failed/.test(figsPop.textContent));
    figsBtn.click();
    ok("figs button toggles the popover closed", !document.querySelector(".fig-figs-pop"));

    // --- help card (the /fig onboarding card, not a toast) ---------------
    helpBtn.click();
    const helpPop = document.querySelector(".fig-onboard");
    ok("help opens the onboarding card", !!helpPop && /How to leave feedback/.test(helpPop.textContent));
    ok("help card lists the tools with icons", helpPop.querySelectorAll(".fig-onboard-row").length >= 4 && helpPop.querySelectorAll(".fig-onboard-icon svg").length >= 4);
    helpPop.querySelector(".fig-onboard-done").click();
    ok("Got it closes the help card", !document.querySelector(".fig-onboard"));

    // --- settings: toggles, dropdown, publish action ---------------------
    const gearBtn = btns2[6];
    gearBtn.click();
    await sleep(100);
    const setPop = document.querySelector(".fig-settings-pop");
    ok("gear opens settings", !!setPop);
    const pubToggle = setPop && setPop.querySelector('input[name="fig-publish-on"]');
    ok("publishing is a toggle, not radio dots", !!pubToggle && pubToggle.type === "checkbox");
    ok("toggle reflects the saved state (on)", !!pubToggle && pubToggle.checked);
    ok("no radio inputs left in settings", !!setPop && setPop.querySelectorAll('input[type="radio"]').length === 0);
    const destSel = setPop && setPop.querySelector('select[name="fig-dest"]');
    ok("review site is a dropdown with both destinations", !!destSel && destSel.options.length === 2 && destSel.value === "linked");
    const linkBox = setPop && setPop.querySelector(".fig-set-linkbox");
    ok("link-a-site flow is collapsed by default (not mandatory-looking)", !!linkBox && linkBox.hidden);
    setPop.querySelector(".fig-set-more").click();
    ok("link flow expands on request", !linkBox.hidden && !!linkBox.querySelector('select[name="fig-provider"]'));
    const pubBtn = setPop.querySelector(".fig-set-publish");
    ok("publish button present", !!pubBtn && /Publish/.test(pubBtn.textContent));
    pubBtn.click();
    await sleep(50);
    ok("publish button calls the companion", (window.__figPublishCalls || []).length === 1);
    ok("publish button shows progress", /Publishing/.test(pubBtn.textContent));
    await sleep(2300); // the deploy poll
    ok("publish reports the deployed URL", /fig-review-test\.vercel\.app/.test(setPop.querySelector(".fig-set-pubnote").textContent));
    gearBtn.click();

    // --- trash is the only real delete -----------------------------------
    clearBtn.click();
    await sleep(50);
    window.__figToggle(); // off
    window.__figToggle(); // on
    await sleep(200);
    ok("cleared state stays cleared after toggle", !document.querySelector(".fig-pin") && !document.querySelector("mark[data-fig-highlight]"));
  } catch (e) {
    out.push("FAIL :: uncaught: " + (e && e.stack || e));
  }
  document.getElementById("results").textContent = out.join("\n");
})();
</script>
</body>
</html>
