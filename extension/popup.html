<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafaf8;
    color: #1a1a1a;
    width: 260px;
    margin: 0;
    padding: 14px;
    font-size: 13px;
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: #4a4a46; line-height: 1.5; }
  label { display: block; margin-bottom: 4px; color: #4a4a46; }
  input {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #e8e6e1;
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
  }
  /* Depth recipe (button-depth study, 2026-07-30): 148° three-stop gradient,
     white bevel on the top edge, dark shade on the bottom, tinted cast
     shadow, no outline. DM Sans 500, sentence case — same as every other
     Fig button. */
  button {
    margin-top: 8px;
    width: 100%;
    border: none;
    background: linear-gradient(148deg, #3a3a37 0%, #1a1a1a 52%, #050505 100%);
    color: #fafaf8;
    border-radius: 6px;
    padding: 7px 12px;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-transform: none;
    cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.28), inset 0 -2px 3px rgba(0, 0, 0, 0.42),
                0 2px 5px -1px rgba(20, 20, 20, 0.45), 0 5px 10px -4px rgba(20, 20, 20, 0.32);
  }
  .status { margin-top: 8px; color: #4a4a46; }
  .conn { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: #4a4a46; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d4d2cc; flex: none; }
  .dot.ok { background: #2C9F28; }
  .dot.bad { background: #916031; }
  .conn a { color: #1a1a1a; }
</style>
</head>
<body>
  <h1>Fig</h1>
  <p>Press <b>⌥ Option+Shift+F</b> on any page to open the tools. The companion must be running locally.</p>
  <button id="open">Open Fig on this page</button>
  <div class="conn" id="conn"><span class="dot" id="dot"></span><span id="connText">Checking companion…</span></div>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
